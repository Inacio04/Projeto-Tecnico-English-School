  <style>
    body {
      font: 400 15px Lato, sans-serif;
      line-height: 1.8;
      color: #818181;
    }
    h2 {
      font-size: 24px;
      text-transform: uppercase;
      color: #303030;
      font-weight: 600;
      margin-bottom: 30px;
    }
    h4 {
      font-size: 19px;
      line-height: 1.375em;
      color: #303030;
      font-weight: 400;
      margin-bottom: 30px;
    }   
    .container-fluid {
      padding: 60px 50px;
    }
    .panel {
      border: 1px solid #2237f5; 
      border-radius: 0 !important;
      transition: box-shadow 0.5s;
    }
    .panel:hover {
      box-shadow: 5px 0px 40px rgba(0,0,0, .2);
    }
    .panel-heading {
      color: #fff !important;
      background-color: #1e45f4 !important;
      padding: 25px;
      border-bottom: 1px solid transparent;
      border-top-left-radius: 0px;
      border-top-right-radius: 0px;
      border-bottom-left-radius: 0px;
      border-bottom-right-radius: 0px;
    }
    /* Estilização para garantir que o texto dentro do cabeçalho azul apareça corretamente */
    .panel-heading h1 {
      font-size: 32px;
      color: #fff !important;
      margin: 0;
      font-family: Montserrat, sans-serif;
    }
    .panel-footer {
      background-color: white !important;
    }
    .panel-footer .btn {
      margin: 15px 0;
      background-color: #1e3ef4;
      color: #fff;
    }
    .panel-footer .btn:hover {
      border: 1px solid #1e2cf4;
      background-color: #fff !important;
      color: #1e22f4;
    }
    .navbar {
      margin-bottom: 0;
      background-color: #1e2cf4;
      z-index: 9999;
      border: 0;
      font-size: 12px !important;
      line-height: 1.42857143 !important;
      letter-spacing: 4px;
      border-radius: 0;
      font-family: Montserrat, sans-serif;
    }
    .navbar li a, .navbar .navbar-brand {
      color: #fff !important;
    }
    .navbar-nav li a:hover, .navbar-nav li.active a {
      color: #1e3ef4 !important;
      background-color: #fff !important;
    }
    .navbar-default .navbar-toggle {
      border-color: transparent;
      color: #fff !important;
    }
    @media screen and (max-width: 768px) {
      .col-sm-4 {
        text-align: center;
        margin: 25px 0;
      }
      .btn-lg {
        width: 100%;
        margin-bottom: 35px;
      }
    }
  </style>
</head>
